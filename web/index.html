<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Short links</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300664f'/%3E%3Crect x='2.5' y='2.5' width='27' height='27' rx='4' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Cpath d='M10 22 21 11M12 10.5h9.5V20' fill='none' stroke='%23fff' stroke-width='3.2'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<svg class="sprite" aria-hidden="true">
			<symbol id="arrow" viewBox="0 0 24 24">
				<path d="M2 12h17M11.5 4.5 19 12l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.6" />
			</symbol>
		</svg>

		<div class="page">
			<header class="sign masthead">
				<div class="masthead-legend">
					<h1 class="wordmark" data-host>Short links</h1>
					<p class="masthead-lead">Paste a long URL and get a short link you can share.</p>
				</div>
				<svg class="arrow arrow-exit" aria-hidden="true"><use href="#arrow" /></svg>
			</header>

			<main class="layout">
				<section class="create" aria-labelledby="create-title">
					<h2 id="create-title">New link</h2>

					<form id="create-form" class="form" novalidate>
						<div class="field">
							<label for="link">Destination URL</label>
							<input
								id="link"
								name="destination"
								class="input"
								type="url"
								inputmode="url"
								autocomplete="url"
								placeholder="https://example.com/a-very-long-url"
								required
								aria-describedby="link-error"
							/>
							<p id="link-error" class="field-error" hidden></p>
						</div>

						<div class="field">
							<label for="hash">Custom alias (optional)</label>
							<div class="input-group">
								<span id="hash-prefix" class="input-prefix" aria-hidden="true">/</span>
								<input
									id="hash"
									name="hash"
									class="input"
									type="text"
									autocomplete="off"
									autocapitalize="off"
									spellcheck="false"
									pattern="[A-Za-z0-9_\-]+"
									placeholder="my-link"
									aria-describedby="hash-hint hash-error"
								/>
							</div>
							<p id="hash-hint" class="field-hint">Leave the alias empty to get a random one.</p>
							<p id="hash-error" class="field-error" hidden></p>
						</div>

						<div class="field">
							<label for="auth">Access code</label>
							<input
								id="auth"
								name="accessCode"
								class="input"
								type="password"
								autocomplete="current-password"
								required
								aria-describedby="auth-error"
							/>
							<p id="auth-error" class="field-error" hidden></p>
						</div>

						<p id="form-error" class="notice" role="alert" hidden></p>

						<button id="create" class="button button-primary" type="submit">Shorten URL</button>
					</form>

					<div id="result" aria-live="polite">
						<section id="result-card" class="sign result" aria-labelledby="result-title" hidden>
							<h2 id="result-title" class="result-title">Your short link is ready</h2>
							<a id="result-link" class="result-link" href="/" target="_blank" rel="noopener"></a>
							<div class="result-foot">
								<button id="copy" class="button button-plate" type="button" aria-live="polite">Copy</button>
								<svg class="arrow" aria-hidden="true"><use href="#arrow" /></svg>
								<p id="result-destination" class="result-destination"></p>
							</div>
						</section>
					</div>
				</section>

				<section class="links" aria-labelledby="links-title">
					<h2 id="links-title">Recent links</h2>
					<p id="links-status" class="links-status" role="status">Loading links…</p>
					<ul id="links" class="links-list" hidden></ul>
				</section>
			</main>
		</div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
