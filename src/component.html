<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>link - 🔗 Short your urls</title>

		<script>
			(function () {
				var stored = localStorage.getItem('theme');
				if (stored !== 'light') document.documentElement.classList.add('dark');
			})();
		</script>

		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							border: 'hsl(var(--border) / <alpha-value>)',
							input: 'hsl(var(--input) / <alpha-value>)',
							ring: 'hsl(var(--ring) / <alpha-value>)',
							background: 'hsl(var(--background) / <alpha-value>)',
							foreground: 'hsl(var(--foreground) / <alpha-value>)',
							primary: {
								DEFAULT: 'hsl(var(--primary) / <alpha-value>)',
								foreground: 'hsl(var(--primary-foreground) / <alpha-value>)',
							},
							secondary: {
								DEFAULT: 'hsl(var(--secondary) / <alpha-value>)',
								foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)',
							},
							destructive: {
								DEFAULT: 'hsl(var(--destructive) / <alpha-value>)',
								foreground: 'hsl(var(--destructive-foreground) / <alpha-value>)',
							},
							muted: {
								DEFAULT: 'hsl(var(--muted) / <alpha-value>)',
								foreground: 'hsl(var(--muted-foreground) / <alpha-value>)',
							},
							accent: {
								DEFAULT: 'hsl(var(--accent) / <alpha-value>)',
								foreground: 'hsl(var(--accent-foreground) / <alpha-value>)',
							},
							card: {
								DEFAULT: 'hsl(var(--card) / <alpha-value>)',
								foreground: 'hsl(var(--card-foreground) / <alpha-value>)',
							},
						},
						borderRadius: {
							lg: 'var(--radius)',
							md: 'calc(var(--radius) - 2px)',
							sm: 'calc(var(--radius) - 4px)',
						},
					},
				},
			};
		</script>

		<style>
			:root {
				--background: 0 0% 100%;
				--foreground: 240 10% 3.9%;
				--card: 0 0% 100%;
				--card-foreground: 240 10% 3.9%;
				--primary: 258 90% 66%;
				--primary-foreground: 0 0% 100%;
				--secondary: 240 4.8% 95.9%;
				--secondary-foreground: 240 5.9% 10%;
				--muted: 240 4.8% 95.9%;
				--muted-foreground: 240 3.8% 46.1%;
				--accent: 258 60% 95%;
				--accent-foreground: 258 90% 30%;
				--destructive: 0 72% 51%;
				--destructive-foreground: 0 0% 98%;
				--border: 240 5.9% 90%;
				--input: 240 5.9% 90%;
				--ring: 258 90% 66%;
				--radius: 0.5rem;
			}

			.dark {
				--background: 240 10% 3.9%;
				--foreground: 0 0% 98%;
				--card: 240 8% 8%;
				--card-foreground: 0 0% 98%;
				--primary: 258 90% 66%;
				--primary-foreground: 0 0% 100%;
				--secondary: 240 6% 14%;
				--secondary-foreground: 0 0% 98%;
				--muted: 240 6% 14%;
				--muted-foreground: 240 5% 65%;
				--accent: 258 40% 20%;
				--accent-foreground: 0 0% 98%;
				--destructive: 0 63% 42%;
				--destructive-foreground: 0 0% 98%;
				--border: 240 6% 18%;
				--input: 240 6% 18%;
				--ring: 258 90% 66%;
			}

			body {
				font-family: 'Inter', sans-serif;
			}
		</style>
	</head>

	<body class="bg-background text-foreground min-h-screen">
		<div class="w-full max-w-2xl mx-auto p-4 sm:p-8 space-y-8">
			<div class="flex items-start justify-between gap-4">
				<div class="space-y-1">
					<h1 class="text-2xl font-bold">🔗 link</h1>
					<p class="text-sm text-muted-foreground">Enter a long URL and we'll shorten it for you.</p>
				</div>
				<button
					id="theme-toggle"
					type="button"
					aria-label="Toggle theme"
					class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-border bg-card text-foreground hover:bg-accent hover:text-accent-foreground"
				>
					<span data-role="theme-icon"></span>
				</button>
			</div>

			<form id="create-form" class="space-y-4 rounded-lg border border-border bg-card p-4 sm:p-6">
				<div class="space-y-1.5">
					<label for="link" class="text-sm font-medium">URL</label>
					<input
						id="link"
						class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
						placeholder="https://example.com/long-url"
						type="url"
						required
					/>
				</div>
				<div class="space-y-1.5">
					<label for="hash" class="text-sm font-medium">Custom hash <span class="text-muted-foreground font-normal">(optional)</span></label>
					<input
						id="hash"
						class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
						placeholder="Leave empty to auto-generate"
						type="text"
					/>
				</div>
				<div class="flex justify-end">
					<button
						id="create"
						type="submit"
						class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 disabled:pointer-events-none disabled:opacity-50"
					>
						Shorten
					</button>
				</div>
				<div id="result" class="text-sm"></div>
			</form>

			<div class="space-y-3">
				<h2 class="text-lg font-bold">Recent URLs</h2>
				<p id="empty-state" class="hidden text-sm text-muted-foreground">No links yet — create one above.</p>
				<div id="links-list" class="space-y-2"></div>
				<script id="links-data" type="application/json">$DATA</script>
			</div>
		</div>

		<script>
			const $ = (el) => document.querySelector(el);
			const $list = $('#links-list');
			const $emptyState = $('#empty-state');
			const $result = $('#result');
			const $form = $('#create-form');

			// --- Theme ---

			const $themeIcon = $('[data-role="theme-icon"]');

			const setTheme = (isDark) => {
				document.documentElement.classList.toggle('dark', isDark);
				localStorage.setItem('theme', isDark ? 'dark' : 'light');
				$themeIcon.textContent = isDark ? '🌙' : '☀️';
			};

			setTheme(document.documentElement.classList.contains('dark'));

			$('#theme-toggle').addEventListener('click', () => {
				setTheme(!document.documentElement.classList.contains('dark'));
			});

			// --- Auth persistence ---

			const AUTH_KEY = 'linkShortener:auth';
			const getStoredAuth = () => localStorage.getItem(AUTH_KEY);
			const rememberAuth = (value) => localStorage.setItem(AUTH_KEY, value);
			const forgetAuth = () => localStorage.removeItem(AUTH_KEY);

			const authorizedFetch = async (path, options = {}) => {
				let auth = getStoredAuth();

				if (!auth) {
					auth = window.prompt('Enter your verification code:');
					if (!auth) throw new Error('cancelled');
				}

				const response = await fetch(path, {
					...options,
					headers: { ...(options.headers || {}), Authorization: auth },
				});

				if (response.status === 401) {
					forgetAuth();
					window.alert('Verification code was rejected. Please try again.');
					throw new Error('unauthorized');
				}

				rememberAuth(auth);
				return response;
			};

			// --- Shared helpers ---

			const isValidDestination = (destination) => {
				if (!destination) return false;
				try {
					new URL(destination.startsWith('http') ? destination : `https://${destination}`);
					return true;
				} catch {
					return false;
				}
			};

			const shortUrlFor = (hash) => `${location.origin}/${hash}`;

			const copyToClipboard = async (text, button) => {
				const original = button.textContent;
				try {
					await navigator.clipboard.writeText(text);
					button.textContent = 'Copied!';
				} catch {
					button.textContent = 'Copy failed';
				}
				setTimeout(() => (button.textContent = original), 1500);
			};

			const updateEmptyState = () => {
				$emptyState.classList.toggle('hidden', $list.children.length > 0);
			};

			// --- List rows ---

			const makeActionButton = (action, label, destructive = false) => {
				const btn = document.createElement('button');
				btn.type = 'button';
				btn.dataset.action = action;
				btn.textContent = label;
				btn.className = `inline-flex h-8 items-center justify-center rounded-md px-2 text-xs font-medium transition-colors ${
					destructive ? 'text-destructive hover:bg-destructive hover:text-destructive-foreground' : 'hover:bg-accent hover:text-accent-foreground'
				}`;
				return btn;
			};

			const buildRow = ({ hash, destination }) => {
				const row = document.createElement('div');
				row.className = 'flex flex-wrap items-center gap-2 rounded-lg border border-border bg-card px-3 py-2';
				row.dataset.hash = hash;

				const link = document.createElement('a');
				link.href = `/${hash}`;
				link.target = '_blank';
				link.rel = 'noopener noreferrer';
				link.className = 'shrink-0 font-mono text-sm text-primary hover:underline';
				link.textContent = `/${hash}`;

				const destView = document.createElement('span');
				destView.dataset.role = 'destination-view';
				destView.className = 'min-w-0 flex-1 truncate text-sm text-muted-foreground';
				destView.textContent = destination;
				destView.title = destination;

				const destEdit = document.createElement('input');
				destEdit.type = 'url';
				destEdit.dataset.role = 'destination-edit';
				destEdit.value = destination;
				destEdit.className = 'hidden h-8 min-w-0 flex-1 rounded-md border border-input bg-background px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring';

				const editError = document.createElement('p');
				editError.dataset.role = 'edit-error';
				editError.className = 'hidden w-full text-xs text-destructive';
				editError.textContent = 'Please enter a valid URL.';

				const viewActions = document.createElement('div');
				viewActions.dataset.role = 'view-actions';
				viewActions.className = 'flex shrink-0 items-center gap-1';
				viewActions.append(makeActionButton('copy', 'Copy'), makeActionButton('edit', 'Edit'), makeActionButton('delete', 'Delete', true));

				const editActions = document.createElement('div');
				editActions.dataset.role = 'edit-actions';
				editActions.className = 'hidden shrink-0 items-center gap-1';
				editActions.append(makeActionButton('save', 'Save'), makeActionButton('cancel', 'Cancel'));

				row.append(link, destView, destEdit, viewActions, editActions, editError);
				return row;
			};

			const enterEditMode = (row) => {
				row.querySelector('[data-role="destination-view"]').classList.add('hidden');
				row.querySelector('[data-role="destination-edit"]').classList.remove('hidden');
				row.querySelector('[data-role="view-actions"]').classList.add('hidden');
				row.querySelector('[data-role="edit-actions"]').classList.remove('hidden');
				row.querySelector('[data-role="edit-actions"]').classList.add('flex');
				row.querySelector('[data-role="destination-edit"]').focus();
			};

			const exitEditMode = (row) => {
				row.querySelector('[data-role="destination-view"]').classList.remove('hidden');
				row.querySelector('[data-role="destination-edit"]').classList.add('hidden');
				row.querySelector('[data-role="edit-actions"]').classList.add('hidden');
				row.querySelector('[data-role="edit-actions"]').classList.remove('flex');
				row.querySelector('[data-role="view-actions"]').classList.remove('hidden');
				row.querySelector('[data-role="edit-error"]').classList.add('hidden');
			};

			$list.addEventListener('click', async (event) => {
				const btn = event.target.closest('button[data-action]');
				if (!btn) return;

				const row = btn.closest('[data-hash]');
				const { hash } = row.dataset;

				if (btn.dataset.action === 'copy') {
					return copyToClipboard(shortUrlFor(hash), btn);
				}

				if (btn.dataset.action === 'edit') {
					const input = row.querySelector('[data-role="destination-edit"]');
					input.value = row.querySelector('[data-role="destination-view"]').textContent;
					return enterEditMode(row);
				}

				if (btn.dataset.action === 'cancel') {
					return exitEditMode(row);
				}

				if (btn.dataset.action === 'save') {
					const input = row.querySelector('[data-role="destination-edit"]');
					const destination = input.value.trim();
					const errorEl = row.querySelector('[data-role="edit-error"]');

					if (!isValidDestination(destination)) {
						errorEl.classList.remove('hidden');
						return;
					}

					try {
						const response = await authorizedFetch(`/${hash}`, {
							method: 'PATCH',
							headers: { 'X-Destination': destination },
						});

						if (response.status === 404) {
							window.alert('This link no longer exists.');
							return row.remove();
						}

						if (!response.ok) {
							errorEl.classList.remove('hidden');
							return;
						}

						const destView = row.querySelector('[data-role="destination-view"]');
						destView.textContent = destination;
						destView.title = destination;
						exitEditMode(row);
					} catch {
						/* prompt cancelled or 401 already alerted */
					}
					return;
				}

				if (btn.dataset.action === 'delete') {
					if (!window.confirm(`Delete /${hash}?`)) return;

					try {
						const response = await authorizedFetch(`/${hash}`, { method: 'DELETE' });
						if (response.ok) {
							row.remove();
							updateEmptyState();
						}
					} catch {
						/* prompt cancelled or 401 already alerted */
					}
				}
			});

			// --- Initial list render ---

			const initialLinks = JSON.parse($('#links-data').textContent || '[]');
			initialLinks.forEach((link) => $list.append(buildRow(link)));
			updateEmptyState();

			// --- Create flow ---

			const showResultError = (message) => {
				$result.replaceChildren();
				const p = document.createElement('p');
				p.className = 'text-destructive';
				p.textContent = `❌ ${message}`;
				$result.append(p);
			};

			const showResultSuccess = (hash) => {
				$result.replaceChildren();
				const wrapper = document.createElement('div');
				wrapper.className = 'flex flex-wrap items-center gap-2';

				const label = document.createElement('span');
				label.className = 'text-muted-foreground';
				label.textContent = '✅ Created:';

				const link = document.createElement('a');
				link.href = `/${hash}`;
				link.target = '_blank';
				link.rel = 'noopener noreferrer';
				link.className = 'font-mono text-primary hover:underline';
				link.textContent = shortUrlFor(hash);

				const copyBtn = makeActionButton('copy-result', 'Copy');
				copyBtn.addEventListener('click', () => copyToClipboard(shortUrlFor(hash), copyBtn));

				wrapper.append(label, link, copyBtn);
				$result.append(wrapper);
			};

			$form.addEventListener('submit', async (event) => {
				event.preventDefault();

				const link = $('#link').value.trim();
				const hash = $('#hash').value.trim();

				if (!isValidDestination(link)) {
					return showResultError('Please enter a valid URL.');
				}

				try {
					const response = await authorizedFetch(`/${hash}`, {
						method: 'POST',
						headers: { 'X-Destination': link },
					});

					if (response.status === 409) {
						return showResultError('That hash is already taken.');
					}

					if (!response.ok) {
						return showResultError('Something went wrong.');
					}

					const created = await response.json();
					showResultSuccess(created.hash);
					$list.prepend(buildRow(created));
					updateEmptyState();
					$form.reset();
				} catch {
					/* prompt cancelled or 401 already alerted */
				}
			});
		</script>
	</body>
</html>
